<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySync</title>
    <link rel="stylesheet" href="stylings.css">
    <link rel="stylesheet" href="formatting.css">
    <!-- Custom Fonts Start -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <!-- Custom Fonts End -->
</head>

<body>
    <header>
        <h1 class="font-bold">StudySync</h1>
        <h2 class="font-ibold">a bespoke TODO list app</h2>
    </header>
    <main>
        <form action="">
            <div id="loginPrompt" class="login-box">
                <label for="username" class="font-bold">Username:</label>
                <input type="text" name="username" id="username" pattern="\d+" required class="font-bold">
                <label for="password" class="font-bold">Password:</label>
                <input type="password" name="password" id="password" required class="font-bold">
                <input type="submit" name="submit" id="submit" value="Login" class="font-bold">
            </div>
        </form>
    </main>
    <footer>
        <p class="font-reg">StudySync &copy;2026</p>
    </footer>
</body>

</html>
